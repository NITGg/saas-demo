# ============================================================================
#  Build & publish the baked SaaS Moodle image to GHCR.
#
#  PLACE THIS FILE IN THE CODE REPO (saas-demo), NOT in nit2:
#      saas-demo/.github/workflows/build-image.yml
#  It builds from that repo's context (the Moodle code) using .docker/Dockerfile.ci.
#
#  Triggers:
#    - push a git tag like  v2026.08      -> publishes  :2026.08  and  :latest
#    - manual "Run workflow" (workflow_dispatch) with an optional tag input
#
#  Output image:  ghcr.io/<owner>/saas-moodle:<tag>   (+ :latest on tag builds)
# ============================================================================
name: build-image

on:
  push:
    tags:
      - "v*"                     # v2026.08, v2026.09, ...
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2026.08). Defaults to the git SHA."
        required: false
        type: string

# GITHUB_TOKEN needs write access to Packages (GHCR) for this repo.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR as the actor that triggered the run.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels: the pushed git tag (minus the leading v), or the
      # manual input, plus :latest, plus the commit SHA for traceability.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saas-moodle
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Speed up repeat builds by caching layers in the Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the image is published, tell the provisioning server to roll every live
  # academy onto the new tag (bump-image.sh --all). Runs only for tag pushes and
  # only when the provisioning URL + secret are configured; otherwise it no-ops.
  rollout:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Roll academies onto the new image
        id: roll
        continue-on-error: true    # let the notify step run even if this fails
        env:
          PROVISION_URL: ${{ vars.PROVISION_URL }}       # e.g. https://saas-provision.academy2026.nitg-eg.com
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          REF: ${{ github.ref_name }}                     # e.g. v2026.09.11
        run: |
          if [ -z "$PROVISION_URL" ] || [ -z "$PROVISION_SECRET" ]; then
            echo "::warning::PROVISION_URL (variable) / PROVISION_SECRET (secret) not set — skipping auto-rollout."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${REF#v}"   # strip the leading v: v2026.09.11 -> 2026.09.11
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "POST ${PROVISION_URL%/}/update-image  tag=$TAG"
          curl -fsS -X POST "${PROVISION_URL%/}/update-image" \
            -H "X-Provision-Secret: $PROVISION_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"$TAG\"}" | tee /tmp/rollout.json
          echo

      - name: Notify Telegram
        if: ${{ always() && steps.roll.outputs.skipped != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.roll.outcome }}
          TAG: ${{ steps.roll.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping notice."; exit 0
          fi
          if [ "$OUTCOME" = "success" ]; then
            MSG="✅ SaaS rollout triggered — all academies are updating to image ${TAG}."
          else
            MSG="❌ SaaS rollout FAILED to trigger for image ${TAG}. Check the run: ${RUN_URL}"
          fi
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MSG}" >/dev/null || echo "::warning::Telegram notify failed"

      - name: Reflect rollout failure in the run
        if: ${{ steps.roll.outcome == 'failure' }}
        run: |
          echo "::error::Rollout request failed — see the 'Roll academies' step."
          exit 1
