  <!-- Camera lens -->
  <circle cx="38" cy="50" r="11" fill="#1D76E2"/>
  <circle cx="38" cy="50" r="7" fill="#ffffff"/>
  <circle cx="38" cy="50" r="4" fill="#1D76E2"/>

