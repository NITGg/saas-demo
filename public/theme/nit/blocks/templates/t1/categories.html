<!-- NIT homepage template T1 · Modern Minimal — CATEGORIES strip.
     theme_nit's engine clones the INNER html of [data-nit-category-card] once per
     top-level category from window.NIT_CATEGORIES, substituting {{url}} {{name}}
     {{coursecount}} and setting [data-nit-category-image] as a background. The
     hidden wrapper stays; each clone's inner card becomes a direct grid child. -->
<div dir="auto"
  style="--t-accent: var(--nit-brand-primary); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 9%, transparent); --t-ink: #16191D; --t-bg: #FFFFFF; --t-bg-alt: #FCFCFB; --t-muted2: #8A8A82; --t-border: #EDEDE9; font-family: 'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg-alt); border-block: 1px solid var(--t-border); color: var(--t-ink);">
  <div style="max-width: 1240px; margin: 0 auto; padding: clamp(40px,5vw,64px) 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px;">
      <div>
        <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-accent); font-weight: 700;">{mlang en}Browse{mlang}{mlang ar}تصفّح{mlang}</div>
        <h2 style="margin: 12px 0 0; font-size: clamp(26px,3vw,34px); font-weight: 250; letter-spacing: -0.02em;">{mlang en}Explore by category{mlang}{mlang ar}استعرض حسب التخصص{mlang}</h2>
      </div>
      <a href="/course/index.php" style="font-size: 14px; color: var(--t-muted2); text-decoration: none;">{mlang en}See all →{mlang}{mlang ar}كل التصنيفات ←{mlang}</a>
    </div>
    <div data-nit-categories="" data-limit="12"
      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px;">
      <!-- CARD TEMPLATE (hidden wrapper; its inner <a> is cloned per category) -->
      <div data-nit-category-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; background: var(--t-bg); border: 1px solid var(--t-border); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box;">
          <span data-nit-category-image=""
            style="width: 34px; height: 34px; border-radius: 9px; background: var(--t-accent-soft) center/contain no-repeat; display: block; flex: 0 0 auto;"></span>
          <span style="font-size: 14px; font-weight: 600;">{{name}}</span>
          <span style="font-size: 11px; color: var(--t-muted2);">{{coursecount}} {mlang en}courses{mlang}{mlang ar}دورة{mlang}</span>
        </a>
      </div>
    </div>
  </div>
</div>
