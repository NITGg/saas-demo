<!-- NIT homepage template T1 · Modern Minimal — GALLERY (images only; testimonials and
     FAQ are their own sections). Fully editable: gallery images (data-nit-edit-img). -->
<div dir="auto" data-nit-section="gallery"
  style="--t-accent: var(--nit-brand-primary); --t-ink: #16191D; --t-bg: #FFFFFF; --t-bg-alt: #FAFAF8; --t-muted: #6E7781; --t-muted2: #8A8A82; --t-border: #EDEDE9; font-family: 'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg); color: var(--t-ink);">
  <!-- gallery grid -->
  <div style="max-width: 1240px; margin: 0 auto; padding: clamp(56px,7vw,100px) 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      <div>
        <div data-nit-edit="gallery_eyebrow" style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-accent); font-weight: 700;">{mlang en}Gallery{mlang}{mlang ar}معرض الصور{mlang}</div>
        <h2 data-nit-edit="gallery_heading" style="margin: 12px 0 0; font-size: clamp(28px,3.4vw,40px); font-weight: 250; letter-spacing: -0.03em;">{mlang en}Inside the academy{mlang}{mlang ar}من داخل الأكاديمية{mlang}</h2>
      </div>
    </div>
    <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
      <div data-nit-edit-img="gallery_1" style="grid-column: span 2; min-height: 260px; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFEFEC 0 12px, #F7F7F5 12px 24px) center/cover no-repeat; display: grid; place-items: center; color: #7C7C74; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;">{mlang en}Photo · classroom{mlang}{mlang ar}صورة · قاعة{mlang}</div>
      <div data-nit-edit-img="gallery_2" style="min-height: 122px; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFEFEC 0 12px, #F7F7F5 12px 24px) center/cover no-repeat;"></div>
      <div data-nit-edit-img="gallery_3" style="min-height: 122px; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFEFEC 0 12px, #F7F7F5 12px 24px) center/cover no-repeat;"></div>
      <div data-nit-edit-img="gallery_4" style="min-height: 122px; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFEFEC 0 12px, #F7F7F5 12px 24px) center/cover no-repeat;"></div>
      <div data-nit-edit-img="gallery_5" style="min-height: 122px; border-radius: 16px; background: repeating-linear-gradient(135deg, #EFEFEC 0 12px, #F7F7F5 12px 24px) center/cover no-repeat;"></div>
    </div>
  </div>
</div>
