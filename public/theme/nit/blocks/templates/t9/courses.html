<!-- NIT homepage template T9 · Elegant Mono — COURSES grid.
     theme_nit's engine clones the INNER html of [data-nit-course-card] once per
     course from window.NIT_COURSES, substituting {{url}} {{fullname}} {{teacher}}
     {{summary}} {{pricebadge}} {{cta}} and setting [data-nit-course-image] as a
     background. Only real course fields are bound (no fake ratings / lesson counts).
     Editorial grid lines come from borders on the container + each cloned card. -->
<div dir="auto" data-nit-section="courses"
  style="--t-accent: var(--nit-brand-primary); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 12%, transparent); --t-ink: #14121F; --t-bg: #F4F1EA; --t-surface: #FFFFFF; --t-muted: #5E5B54; --t-muted2: #8F8B80; --t-border: #DAD5C7; font-family: 'Syne','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg); color: var(--t-ink); padding: clamp(56px,7vw,96px) 0;">
  <div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(20px,4vw,44px);">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--t-ink); padding-bottom: 24px;">
      <div>
        <div style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--t-accent); font-weight: 700;">{mlang en}Our courses{mlang}{mlang ar}دوراتنا{mlang}</div>
        <h2 style="margin: 16px 0 0; font-size: clamp(34px,5vw,56px); font-weight: 800; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1;">{mlang en}Featured courses{mlang}{mlang ar}دورات مختارة{mlang}</h2>
      </div>
      <a href="/course/index.php" style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--t-ink); text-decoration: none; border-bottom: 2px solid var(--t-ink); padding-bottom: 4px;">{mlang en}Full programme{mlang}{mlang ar}البرنامج الكامل{mlang}</a>
    </div>
    <div data-nit-courses="" data-limit="6" data-cta-label="→" data-continue-label="→"
      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; border-inline-start: 1px solid var(--t-border);">
      <!-- CARD TEMPLATE (hidden wrapper; its inner card is cloned per course) -->
      <div data-nit-course-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; background: var(--t-bg); border-inline-end: 1px solid var(--t-border); border-bottom: 1px solid var(--t-border); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box; padding: clamp(24px,2.4vw,34px);">
          <div data-nit-course-image=""
            style="aspect-ratio: 4/3; background: repeating-linear-gradient(135deg, #EDE9DF 0 12px, #F6F4EE 12px 24px) center/cover no-repeat; display: grid; place-items: center; color: #8F8B80; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700;"></div>
          <div style="display: flex; align-items: center; gap: 9px; margin-top: 24px;">
            <span style="width: 6px; height: 6px; background: var(--t-accent); display: block; flex: 0 0 auto;"></span>
            <span style="font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--t-muted2); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{teacher}}</span>
          </div>
          <h3 style="margin: 14px 0 0; font-size: clamp(22px,2vw,26px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.14; text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{fullname}}</h3>
          <p style="margin: 14px 0 0; font-size: 14px; line-height: 1.8; color: var(--t-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{summary}}</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 26px;">
            <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.02em;">{{pricebadge}}</span>
            <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--t-accent);">{mlang en}View{mlang}{mlang ar}عرض{mlang} {{cta}}</span>
          </div>
        </a>
      </div>
    </div>
  </div>
  <script>
    /* Shared hover effects for .nit-btn-solid / .nit-btn-ghost / cards. Idempotent. */
    (function () {
      if (document.getElementById('nit-hoverfx-style')) { return; }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,18,31,.28)}' +
        '.nit-btn-ghost:not(:disabled):hover{border-color:var(--nit-brand-primary)!important;color:#fff;transform:translateY(-2px)}' +
        '[data-nit-copy]:hover{filter:brightness(1.12);transform:translateY(-2px)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover{background:var(--nit-brand-primary)!important;color:#fff!important}' +
        '[data-nit-categories]>a:hover *{color:#fff!important}' +
        '[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-4px)}' +
        '[data-nit-about-card]:hover{border-color:var(--nit-brand-primary)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
