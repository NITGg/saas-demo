<!-- NIT homepage template T3 · Academic Classic — COUPONS / scholarships (live).
     Fetches active coupons from local_nit_commerce and renders a horizontal slider.
     The <script>, every data-nit-* hook and the {{...}} tokens are kept exactly as the
     shared seed (the loader reuses the template card's own style attribute, so its
     outer style keeps `display: none;` + the card width) — only the visual styles are T3. -->
<div dir="auto"
  style="--t-accent: var(--nit-brand-primary); --t-accent-bright: color-mix(in srgb, var(--nit-brand-primary) 55%, #fff); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 18%, transparent); --t-on-accent: var(--nit-brand-on-primary, #fff); --t-navy: #0B2545; --t-on-navy: #C3CEDC; --t-on-navy2: #8FA0B4; font-family: 'Almarai','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-navy); border-top: 4px solid var(--t-accent); color: #fff; padding: clamp(48px,6vw,72px) 16px;"
  data-nit-coupons="" data-endpoint="/local/nit_commerce/api.php" data-base="">
  <div style="max-width: 1220px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 36px;">
      <div style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--t-accent-bright); font-weight: 700;">{mlang en}Scholarships{mlang}{mlang ar}المنح{mlang}</div>
      <h2 style="margin: 14px 0 0; font-family: 'Libre Baskerville','Amiri','Almarai',Georgia,serif; font-size: clamp(24px,3vw,30px); font-weight: 700; color: #fff;">{mlang en}Scholarships &amp; concessions{mlang}{mlang ar}المنح والخصومات{mlang}</h2>
      <p style="margin: 8px 0 0; font-size: 13px; color: var(--t-on-navy);">{mlang en}Quote the reference when you apply.{mlang}{mlang ar}اذكر الرمز عند التقديم.{mlang}</p>
    </div>
    <!-- Slider Wrapper -->
    <div style="position: relative; padding: 0 28px;">
      <button style="position: absolute; inset-inline-start: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--t-accent) 55%, transparent); background: var(--t-navy); color: var(--t-accent-bright); font-size: 26px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.3);"
        type="button" data-nit-coupons-scroll="prev"> ‹ </button>
      <div style="display: flex; flex-direction: row; flex-wrap: nowrap; align-items: stretch; gap: 16px; width: 100%; overflow-x: auto; overflow-y: hidden; padding: 8px 4px 20px; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: thin;"
        data-nit-coupons-scroller=""><!-- CARD TEMPLATE -->
        <div style="display: none; flex: 0 0 300px; width: 300px; min-width: 300px; max-width: 300px; scroll-snap-align: start; align-self: stretch;"
          data-nit-coupons-card="">
          <div style="box-sizing: border-box; width: 100%; min-height: 150px; height: 100%; display: flex; align-items: stretch; background: rgba(255,255,255,0.04); border: 1px dashed color-mix(in srgb, var(--t-accent) 60%, transparent); overflow: hidden;">
            <!-- VALUE -->
            <div style="flex: 0 0 104px; background: linear-gradient(135deg, var(--t-accent), color-mix(in srgb, var(--t-accent) 72%, #000)); color: var(--t-on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px;">
              <strong style="font-family: 'Libre Baskerville','Almarai',Georgia,serif; font-size: 26px; line-height: 1; font-weight: 700;" data-nit-value=""> {{value}} </strong>
              <span style="font-size: 11px; font-weight: bold; margin-top: 4px;" data-nit-valuelabel=""> {{valuelabel}} </span>
            </div>
            <!-- BODY -->
            <div style="flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 7px;">
              <button style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-family: ui-monospace, monospace; font-weight: bold; font-size: 15px; letter-spacing: 0.08em; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; cursor: pointer;"
                type="button" data-nit-copy="" data-code="{{code}}"> {{code}} <span aria-hidden="true">⧉</span> </button>
              <p data-nit-scope="" style="font-size: 12px; color: var(--t-on-navy); margin: 0;">{{scope}}</p>
              <p data-nit-usage="" style="font-size: 12px; color: var(--t-on-navy); margin: 0;">{{usage}}</p>
              <p data-nit-max="" style="font-size: 12px; color: var(--t-accent-bright); margin: 0;">{{max}}</p>
              <p data-nit-dates="" style="font-size: 11px; color: var(--t-on-navy2); margin: 0;">{{dates}}</p>
            </div>
          </div>
        </div>
        <!-- STATUS MESSAGE -->
        <div style="color: var(--t-on-navy); padding: 24px 8px; font-size: 15px;" data-nit-coupons-msg="">…</div>
      </div>
      <button style="position: absolute; inset-inline-end: -23px; top: 50%; transform: translateY(-50%); z-index: 20; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--t-accent) 55%, transparent); background: var(--t-navy); color: var(--t-accent-bright); font-size: 26px; font-weight: bold; line-height: 1; padding: 0; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.3);"
        type="button" data-nit-coupons-scroll="next"> › </button>
    </div>
  </div>
  <script>
    (function() {
      var root =
        (document.currentScript &&
          document.currentScript.closest('[data-nit-coupons]')) ||
        document.querySelector('[data-nit-coupons]');

      if (!root || root.getAttribute('data-nit-wired')) {
        return;
      }

      root.setAttribute('data-nit-wired', '1');

      var scroller = root.querySelector('[data-nit-coupons-scroller]');
      var tpl = root.querySelector('[data-nit-coupons-card]');
      var msg = root.querySelector('[data-nit-coupons-msg]');

      var base =
        window.M && M.cfg && M.cfg.wwwroot ?
        M.cfg.wwwroot :
        root.getAttribute('data-base') || '';

      var endpoint =
        base +
        root.getAttribute('data-endpoint') +
        '?function=get_available_coupons';

      function esc(s) {
        return String(s == null ? '' : s).replace(
          /[&<>"]/g,
          function(c) {
            return {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;'
            } [c];
          }
        );
      }

      function num(n) {
        return (
          Math.round(Number(n) * 100) / 100
        ).toLocaleString(undefined, {
          minimumFractionDigits: 0
        });
      }

      function fmt(ts) {
        return ts ?
          new Date(ts * 1000).toLocaleDateString() :
          null;
      }

      function say(t) {
        if (msg) {
          msg.textContent = t;
          msg.style.display = '';
        }
      }

      /* Slider arrows */
      Array.prototype.forEach.call(
        root.querySelectorAll('[data-nit-coupons-scroll]'),
        function(btn) {
          btn.addEventListener('click', function() {
            var dir =
              btn.getAttribute('data-nit-coupons-scroll') === 'next' ?
              1 :
              -1;

            if (
              getComputedStyle(scroller).direction === 'rtl'
            ) {
              dir = -dir;
            }

            scroller.scrollBy({
              left: dir *
                Math.max(
                  320,
                  Math.round(scroller.clientWidth * 0.8)
                ),
              behavior: 'smooth'
            });
          });
        }
      );

      say(
        '{mlang en}Loading…{mlang}{mlang ar}جاري التحميل…{mlang}'
      );

      fetch(endpoint, {
          headers: {
            Accept: 'application/json'
          }
        })
        .then(function(r) {
          return r.json();
        })
        .then(function(res) {
          if (!res || res.status !== 'success') {
            throw new Error('load failed');
          }

          var rows = res.data || [];

          if (!rows.length) {
            say(
              '{mlang en}No coupons available right now.{mlang}{mlang ar}لا توجد كوبونات متاحة حالياً.{mlang}'
            );
            return;
          }

          if (msg) {
            msg.style.display = 'none';
          }

          var pctLabel =
            '{mlang en}OFF{mlang}{mlang ar}خصم{mlang}';

          var egpLabel =
            '{mlang en}EGP OFF{mlang}{mlang ar}ج.م خصم{mlang}';

          rows.forEach(function(c) {
            var isPct =
              c.discount_type === 'percent';

            var value = isPct ?
              num(c.discount_value) + '%' :
              num(c.discount_value);

            var scope =
              c.applies_to && c.applies_to.length ?
              c.applies_to
              .map(function(a) {
                return a.label;
              })
              .join(', ') :
              '';

            var s = fmt(c.startdate);
            var e = fmt(c.enddate);

            var dates =
              s || e ?
              '{mlang en}Valid{mlang}{mlang ar}صالح{mlang} ' +
              (s || '…') +
              ' → ' +
              (e || '…') :
              '';

            /* Usage type */
            var usage;

            if (c.usage_type === 'once') {
              usage =
                '{mlang en}One-time use{mlang}{mlang ar}استخدام لمرة واحدة{mlang}';
            } else {
              usage =
                '{mlang en}Multiple use{mlang}{mlang ar}استخدام متعدد{mlang}';

              if (c.usage_limit > 0) {
                usage +=
                  ' (' +
                  (c.usage_count || 0) +
                  '/' +
                  c.usage_limit +
                  ')';
              }
            }

            /* Max discount */
            var max =
              c.max_discount != null &&
              Number(c.max_discount) > 0 ?
              '{mlang en}Max discount{mlang}{mlang ar}أقصى خصم{mlang}: ' +
              num(c.max_discount) +
              ' EGP' :
              '';

            var html = tpl.innerHTML
              .replace(/\{\{value\}\}/g, esc(value))
              .replace(
                /\{\{valuelabel\}\}/g,
                isPct ? pctLabel : egpLabel
              )
              .replace(/\{\{code\}\}/g, esc(c.code))
              .replace(/\{\{scope\}\}/g, esc(scope))
              .replace(/\{\{usage\}\}/g, esc(usage))
              .replace(/\{\{max\}\}/g, esc(max))
              .replace(/\{\{dates\}\}/g, esc(dates));

            var wrap = document.createElement('div');

            wrap.style.cssText =
              tpl
              .getAttribute('style')
              .replace('display: none;', '');

            /*
             * Make generated cards flex containers so every card stretches
             * to the height of the tallest card in the row.
             */
            wrap.style.display = 'flex';
            wrap.style.alignItems = 'stretch';

            wrap.setAttribute(
              'data-nit-coupons-card',
              ''
            );

            wrap.innerHTML = html;

            if (!scope) {
              var sc =
                wrap.querySelector('[data-nit-scope]');

              if (sc) {
                sc.style.display = 'none';
              }
            }

            if (!max) {
              var mx =
                wrap.querySelector('[data-nit-max]');

              if (mx) {
                mx.style.display = 'none';
              }
            }

            if (!dates) {
              var dt =
                wrap.querySelector('[data-nit-dates]');

              if (dt) {
                dt.style.display = 'none';
              }
            }

            var btn =
              wrap.querySelector('[data-nit-copy]');

            if (btn) {
              btn.addEventListener(
                'click',
                function() {
                  var code =
                    btn.getAttribute('data-code');

                  if (navigator.clipboard) {
                    navigator.clipboard
                      .writeText(code)
                      .catch(function() {});
                  }

                  var old =
                    btn.style.borderColor;

                  btn.style.borderColor =
                    'var(--nit-brand-primary)';

                  setTimeout(function() {
                    btn.style.borderColor = old;
                  }, 1200);
                }
              );
            }

            scroller.appendChild(wrap);
          });
        })
        .catch(function() {
          say(
            '{mlang en}Could not load coupons.{mlang}{mlang ar}تعذّر تحميل الكوبونات.{mlang}'
          );
        });
    })();
  </script>
  <script>
    /* Shared hover effects (T3 flavour). Idempotent via id. */
    (function () {
      if (document.getElementById('nit-hoverfx-style')) { return; }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 16px 34px rgba(11,37,69,.22)}' +
        '.nit-btn-ghost:not(:disabled):hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px);box-shadow:0 12px 26px rgba(11,37,69,.12)}' +
        '[data-nit-copy]:hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover,[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-4px);box-shadow:0 22px 48px rgba(11,37,69,.16)}' +
        '[data-nit-about-card]:hover{transform:translateY(-4px);border-color:var(--nit-brand-primary)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
