<!-- NIT homepage template T3 · Academic Classic — CATEGORIES / faculties strip.
     theme_nit's engine clones the INNER html of [data-nit-category-card] once per
     top-level category from window.NIT_CATEGORIES, substituting {{url}} {{name}}
     {{coursecount}} and setting [data-nit-category-image] as a background. The
     hidden wrapper stays; each clone's inner <a> becomes a direct grid child. -->
<div dir="auto"
  style="--t-accent: var(--nit-brand-primary); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 14%, transparent); --t-ink: #0B2545; --t-surface: #FFFFFF; --t-surface-alt: #F5F1E7; --t-muted2: #6A7789; --t-border: #DED6C6; font-family: 'Almarai','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-surface-alt); border-bottom: 1px solid var(--t-border); color: var(--t-ink);">
  <div data-nit-categories="" data-limit="10"
    style="max-width: 1220px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));">
    <!-- CARD TEMPLATE (hidden wrapper; its inner <a> is cloned per category) -->
    <div data-nit-category-card="" style="display: none;">
      <a href="{{url}}"
        style="display: block; padding: 30px 24px; border-inline-end: 1px solid var(--t-border); border-top: 1px solid var(--t-border); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box;">
        <span data-nit-category-image=""
          style="width: 26px; height: 26px; background: var(--t-accent) center/contain no-repeat; display: block;"></span>
        <span style="display: block; font-size: 15px; font-weight: 700; margin-top: 14px;">{{name}}</span>
        <span style="display: block; font-size: 12px; color: var(--t-muted2); margin-top: 6px;">{{coursecount}} {mlang en}courses{mlang}{mlang ar}دورة{mlang}</span>
      </a>
    </div>
  </div>
  <script>
    /* Shared hover effects for .nit-btn-solid / .nit-btn-ghost / cards. Idempotent. */
    (function () {
      if (document.getElementById('nit-hoverfx-style')) { return; }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 16px 34px rgba(11,37,69,.22)}' +
        '.nit-btn-ghost:not(:disabled):hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px);box-shadow:0 12px 26px rgba(11,37,69,.12)}' +
        '[data-nit-copy]:hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover,[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-4px);box-shadow:0 22px 48px rgba(11,37,69,.16)}' +
        '[data-nit-about-card]:hover{transform:translateY(-4px);border-color:var(--nit-brand-primary)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
