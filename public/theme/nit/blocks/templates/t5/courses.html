<!-- NIT homepage template T5 · Warm Editorial — COURSES grid.
     theme_nit's engine clones the INNER html of [data-nit-course-card] once per
     course from window.NIT_COURSES, substituting {{url}} {{fullname}} {{teacher}}
     {{summary}} {{pricebadge}} {{cta}} and setting [data-nit-course-image] as a
     background. Only real course fields are bound (no fake ratings / week counts /
     category tags). -->
<div dir="auto" data-nit-section="courses"
  style="--t-accent: var(--nit-brand-primary); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 12%, transparent); --t-ink: #241A12; --t-bg: #FAF3E7; --t-muted: #5C4A3C; --t-muted2: #8A7666; --t-border: #D6C6B2; --t-line: #241A12; --t-serif: 'Libre Baskerville', Georgia, 'Amiri', serif; font-family: 'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg); color: var(--t-ink); padding: clamp(56px,7vw,88px) 0;">
  <div style="max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px,4vw,44px);">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--t-line); padding-bottom: 22px;">
      <h2 style="margin: 0; font-family: var(--t-serif); font-size: clamp(34px,5vw,56px); font-weight: 700; letter-spacing: -0.02em;">{mlang en}Our courses{mlang}{mlang ar}دوراتنا{mlang}</h2>
      <a href="/course/index.php" style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t-accent); text-decoration: none;">{mlang en}Full listing →{mlang}{mlang ar}القائمة الكاملة →{mlang}</a>
    </div>
    <div data-nit-courses="" data-limit="6" data-cta-label="→" data-continue-label="→"
      style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: clamp(28px,3vw,36px);">
      <!-- CARD TEMPLATE (hidden wrapper; its inner card is cloned per course) -->
      <div data-nit-course-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; background: var(--t-bg); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box;">
          <div data-nit-course-image=""
            style="aspect-ratio: 4/3.4; background: repeating-linear-gradient(135deg, #EFE2CD 0 12px, #F6EDDD 12px 24px) center/cover no-repeat; display: grid; place-items: center; color: #9C8A75; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; border: 1px solid var(--t-border);"></div>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 20px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--t-muted2);">
            <span style="width: 22px; height: 1px; background: var(--t-accent); display: block; flex: 0 0 auto;"></span>
            <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{teacher}}</span>
          </div>
          <h3 style="margin: 12px 0 0; font-family: var(--t-serif); font-size: clamp(22px,2.4vw,28px); line-height: 1.16; font-weight: 700; letter-spacing: -0.02em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{fullname}}</h3>
          <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.8; color: var(--t-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">{{summary}}</p>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--t-border);">
            <span style="font-family: var(--t-serif); font-size: 20px; font-weight: 700; letter-spacing: -0.01em;">{{pricebadge}}</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-accent);">{mlang en}View{mlang}{mlang ar}عرض{mlang} {{cta}}</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
