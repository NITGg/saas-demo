<!-- NIT homepage template T4 · Dark Premium — COURSES grid.
     theme_nit's engine clones the INNER html of [data-nit-course-card] once per
     course from window.NIT_COURSES, substituting {{url}} {{fullname}} {{teacher}}
     {{pricebadge}} {{cta}} and setting [data-nit-course-image] as a background.
     Only real course fields are bound (no fake ratings / lesson counts). -->
<div dir="auto" data-nit-section="courses"
  style="--t-accent: var(--nit-brand-primary); --t-accent-2: var(--nit-brand-accent); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 12%, transparent); --t-bg: #07090D; --t-surface: rgba(255,255,255,0.04); --t-ink: #E8ECF1; --t-white: #FFFFFF; --t-muted: #9AA5B4; --t-muted2: #778393; --t-border: rgba(255,255,255,0.09); font-family: 'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg); color: var(--t-ink); padding: clamp(48px,6vw,100px) 0;">
  <div style="max-width: 1280px; margin: 0 auto; padding: 0 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;">
      <div>
        <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-accent); font-weight: 700;">{mlang en}Our courses{mlang}{mlang ar}دوراتنا{mlang}</div>
        <h2 style="margin: 14px 0 0; font-size: clamp(28px,3.4vw,44px); font-weight: 600; letter-spacing: -0.035em; color: var(--t-white);">{mlang en}Featured courses{mlang}{mlang ar}دورات مختارة{mlang}</h2>
      </div>
      <a class="nit-btn-ghost" href="/course/index.php"
        style="font-size: 14px; font-weight: 600; color: var(--t-accent); text-decoration: none; padding: 12px 22px; border: 1px solid color-mix(in srgb, var(--t-accent) 30%, transparent); border-radius: 10px;">{mlang en}View all courses{mlang}{mlang ar}كل الدورات{mlang}</a>
    </div>
    <div data-nit-courses="" data-limit="6" data-cta-label="→" data-continue-label="→"
      style="margin-top: 42px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;">
      <!-- CARD TEMPLATE (hidden wrapper; its inner card is cloned per course) -->
      <div data-nit-course-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; background: var(--t-surface); border: 1px solid var(--t-border); border-radius: 20px; overflow: hidden; backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box;">
          <div data-nit-course-image=""
            style="aspect-ratio: 16/9; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--t-accent) 10%, transparent) 0 12px, rgba(255,255,255,0.03) 12px 24px) center/cover no-repeat; display: grid; place-items: center; color: #7E8A9A; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700;"></div>
          <div style="padding: 22px; display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <h3 style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.35; letter-spacing: -0.015em; color: var(--t-white); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{fullname}}</h3>
            <div style="display: flex; align-items: center; gap: 9px; margin-top: 14px;">
              <span style="width: 28px; height: 28px; border-radius: 50%; background: var(--t-accent-soft); color: var(--t-accent); display: grid; place-items: center; font-size: 13px; flex: 0 0 auto;">👤</span>
              <span style="font-size: 13px; color: var(--t-muted);">{{teacher}}</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.08);">
              <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--t-white);">{{pricebadge}}</span>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--t-accent);">{mlang en}View{mlang}{mlang ar}عرض{mlang} {{cta}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
