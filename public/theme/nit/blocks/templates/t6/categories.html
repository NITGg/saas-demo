<!-- NIT homepage template T6 · Soft Glass — CATEGORIES strip.
     theme_nit's engine clones the INNER html of [data-nit-category-card] once per
     top-level category from window.NIT_CATEGORIES, substituting {{url}} {{name}}
     {{coursecount}} and setting [data-nit-category-image] as a background. The
     hidden wrapper stays; each clone's inner card becomes a direct grid child. -->
<div dir="auto"
  style="--t-accent: var(--nit-brand-primary); --t-accent-2: var(--nit-brand-accent); --t-accent-soft: color-mix(in srgb, var(--nit-brand-primary) 12%, transparent); --t-ink: #10243E; --t-muted2: #8E93A8; --t-glass: rgba(255,255,255,0.6); --t-glass-border: rgba(255,255,255,0.85); font-family: 'Public Sans','IBM Plex Sans Arabic',system-ui,sans-serif; background: linear-gradient(170deg, color-mix(in srgb, var(--t-accent) 7%, #fff), color-mix(in srgb, var(--t-accent-2) 8%, #fff)); color: var(--t-ink);">
  <div style="max-width: 1240px; margin: 0 auto; padding: clamp(40px,5vw,64px) 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px;">
      <div>
        <div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--t-accent); font-weight: 700;">{mlang en}Browse{mlang}{mlang ar}تصفّح{mlang}</div>
        <h2 style="margin: 12px 0 0; font-size: clamp(26px,3vw,34px); font-weight: 500; letter-spacing: -0.02em;">{mlang en}Explore by category{mlang}{mlang ar}استعرض حسب التخصص{mlang}</h2>
      </div>
      <a href="/course/index.php" style="font-size: 14px; font-weight: 600; color: var(--t-accent); background: var(--t-glass); border: 1px solid var(--t-glass-border); border-radius: 999px; padding: 11px 20px; text-decoration: none; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">{mlang en}See all →{mlang}{mlang ar}كل التصنيفات ←{mlang}</a>
    </div>
    <div data-nit-categories="" data-limit="12"
      style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px;">
      <!-- CARD TEMPLATE (hidden wrapper; its inner <a> is cloned per category) -->
      <div data-nit-category-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: var(--t-glass); border: 1px solid var(--t-glass-border); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 28px rgba(16,36,62,0.07);">
          <span data-nit-category-image=""
            style="width: 34px; height: 34px; border-radius: 12px; background: var(--t-accent-soft) center/contain no-repeat; display: block; flex: 0 0 auto;"></span>
          <span style="font-size: 14px; font-weight: 600; margin-top: 4px;">{{name}}</span>
          <span style="font-size: 12px; color: var(--t-muted2);">{{coursecount}} {mlang en}courses{mlang}{mlang ar}دورة{mlang}</span>
        </a>
      </div>
    </div>
  </div>
  <script>
    /* Shared hover effects for .nit-btn-solid / .nit-btn-ghost / cards. Idempotent. */
    (function () {
      if (document.getElementById('nit-hoverfx-style')) { return; }
      var css =
        '.nit-btn-solid,.nit-btn-ghost,[data-nit-copy],[data-nit-scroll],[data-nit-coupons-scroll],[data-nit-categories]>a,[data-nit-my-courses]>div,[data-nit-about-card]{transition:background-color .2s ease,background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}' +
        '.nit-btn-solid:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 16px 36px color-mix(in srgb,var(--nit-brand-primary) 36%,transparent)}' +
        '.nit-btn-ghost:not(:disabled):hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px);box-shadow:0 12px 28px rgba(16,36,62,.12)}' +
        '[data-nit-copy]:hover{border-color:var(--nit-brand-primary)!important;transform:translateY(-2px)}' +
        '[data-nit-scroll]:hover,[data-nit-coupons-scroll]:hover{transform:translateY(-50%) scale(1.08)!important}' +
        '[data-nit-categories]>a:hover,[data-nit-my-courses]>div:not([data-nit-my-course-card]):not([data-nit-my-courses-empty]):hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(16,36,62,.16)}' +
        '[data-nit-about-card]:hover{transform:translateY(-4px);border-color:var(--nit-brand-primary)!important}';
      var st = document.createElement('style');
      st.id = 'nit-hoverfx-style';
      st.textContent = css;
      (document.head || document.documentElement).appendChild(st);
    })();
  </script>
</div>
