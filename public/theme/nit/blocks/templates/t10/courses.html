<!-- NIT homepage template T10 · Vibrant Duotone — COURSES grid.
     theme_nit's engine clones the INNER html of [data-nit-course-card] once per
     course from window.NIT_COURSES, substituting {{url}} {{fullname}} {{teacher}}
     {{pricebadge}} {{cta}} and setting [data-nit-course-image] as a background.
     Only real course fields are bound (no fake ratings / lesson counts). -->
<div dir="auto" data-nit-section="courses"
  style="--t-accent: var(--nit-brand-primary); --t-accent-2: var(--nit-brand-accent); --t-on-accent: var(--nit-brand-on-primary, #fff); --t-ink: #14121F; --t-bg: #F4F1EA; --t-surface: #FFFFFF; --t-muted: #5C5872; --t-border: #E2DDD2; font-family: 'Syne','Changa','IBM Plex Sans Arabic',system-ui,sans-serif; background: var(--t-bg); color: var(--t-ink); padding: clamp(48px,7vw,88px) 0;">
  <div style="max-width: 1300px; margin: 0 auto; padding: 0 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;">
      <div>
        <div style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t-accent); font-weight: 800;">{mlang en}Our courses{mlang}{mlang ar}دوراتنا{mlang}</div>
        <h2 style="margin: 14px 0 0; font-size: clamp(32px,4.5vw,52px); font-weight: 800; letter-spacing: -0.045em; line-height: 1;">{mlang en}Featured courses{mlang}{mlang ar}دورات مختارة{mlang}</h2>
      </div>
      <a class="nit-btn-solid" href="/course/index.php"
        style="font-size: 14px; font-weight: 800; background: var(--t-ink); color: #fff; padding: 14px 24px; text-decoration: none;">{mlang en}All courses{mlang}{mlang ar}كل الدورات{mlang}</a>
    </div>
    <div data-nit-courses="" data-limit="6" data-cta-label="→" data-continue-label="→"
      style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px;">
      <!-- CARD TEMPLATE (hidden wrapper; its inner card is cloned per course) -->
      <div data-nit-course-card="" style="display: none;">
        <a href="{{url}}"
          style="display: flex; flex-direction: column; background: var(--t-surface); border: 3px solid var(--t-ink); text-decoration: none; color: var(--t-ink); height: 100%; box-sizing: border-box;">
          <div data-nit-course-image=""
            style="position: relative; aspect-ratio: 16/10; overflow: hidden; background: repeating-linear-gradient(135deg, #DED9CE 0 12px, #EAE5DA 12px 24px) center/cover no-repeat;">
            <div style="position: absolute; inset: 0; background: linear-gradient(140deg, color-mix(in srgb, var(--t-accent) 80%, transparent), color-mix(in srgb, var(--t-accent-2) 70%, transparent)); mix-blend-mode: hard-light;"></div>
          </div>
          <div style="padding: 24px; border-top: 3px solid var(--t-ink); display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <h3 style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.22; letter-spacing: -0.03em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{fullname}}</h3>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--t-muted); font-weight: 600;">
              <span style="width: 7px; height: 7px; background: var(--t-accent-2); display: block; flex: 0 0 auto;"></span>
              <span>{{teacher}}</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--t-border);">
              <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em;">{{pricebadge}}</span>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: var(--t-accent); color: var(--t-on-accent); padding: 10px 16px;">{mlang en}View{mlang}{mlang ar}عرض{mlang} {{cta}}</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
