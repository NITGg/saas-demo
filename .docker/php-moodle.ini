max_input_vars = 5000
zend.exception_ignore_args = On
memory_limit = 256M
; Video-friendly upload caps — clients upload 300 MB–1 GB course videos; the old
; 100M default rejected them. Moodle streams uploads to disk, so memory_limit
; stays modest. post_max_size must be >= upload_max_filesize.
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 600
max_input_time = 600
