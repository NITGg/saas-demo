max_input_vars = 5000
zend.exception_ignore_args = On
memory_limit = 256M
; Video-friendly upload caps — clients upload 300 MB–1 GB course videos AND Jibri
; POSTs Jitsi session recordings to record_notify.php (which re-uploads them to
; Vimeo synchronously). The old 100M default rejected them. PHP streams uploads to
; disk, so memory_limit stays modest. post_max_size must be >= upload_max_filesize.
; The time limits are generous so a large recording upload + the onward Vimeo tus
; transfer don't time out mid-request.
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 1800
max_input_time = 1800
